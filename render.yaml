services:
  - type: web
    name: arena-bot-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && playwright install --with-deps chromium"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ARENA_EMAIL
        sync: false
      - key: ARENA_PASSWORD
        sync: false
      - key: MY_SECRET_KEY
        sync: false
